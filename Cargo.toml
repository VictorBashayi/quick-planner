[package]
name = "quick-planner"
version = "0.1.0"
edition = "2024"

[dependencies]
global-hotkey = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "software-renderer-systemfonts", "unstable-winit-030", "accessibility"] }
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Dwm", "Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_System_SystemInformation", "Win32_System_Time", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
